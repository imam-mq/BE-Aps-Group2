openapi: 3.0.3
info:
  title: Docs API pengelolaan data aplikasi.
  version: 1.0.0
  description: |
    Endpoint di grup Aplikasi memerlukan token JWT. Dapatkan token lewat
    POST /api/auth/login, lalu klik Authorize dan isi tokennya.
servers:
  - url: http://localhost:4000
tags:
  - name: Auth
    description: Setup admin, login, dan reset password
  - name: Aplikasi
    description: Data aplikasi (login terlebih dahulu untuk dapat token)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    NamaParam:
      name: nama
      in: path
      required: true
      description: Sebagian nama aplikasi (tidak peka huruf besar/kecil)
      schema:
        type: string
      example: SAP

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Data tidak ditemukan
    BadRequest:
      description: Data yang dikirim tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Pesan kesalahan

    Aplikasi:
      type: object
      description: password_login selalu ditampilkan tersamar, tidak pernah nilai aslinya.
      properties:
        id:
          type: integer
          example: 32
        nama_aplikasi:
          type: string
          example: SAP
        url_link:
          type: string
          example: https://contoh.example.com
        user_login:
          type: string
          example: contoh-user
        password_login:
          type: string
          example: "•••••"
        lokasi_server:
          type: string
          example: Server-A
        lokasi_database:
          type: string
          example: DB-A
        layanan:
          type: string
          example: Keuangan
        koneksi:
          type: string
          example: VPN
        skala:
          type: string
          enum: [Kecil, Sedang, Besar]
          example: Kecil
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delete_at:
          type: string
          format: date-time
          nullable: true

    AplikasiList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Aplikasi"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 19
            totalPages:
              type: integer
              example: 2

    AplikasiCreate:
      type: object
      required: [nama_aplikasi, password_login]
      properties:
        nama_aplikasi:
          type: string
          example: SAP
        url_link:
          type: string
          example: https://contoh.example.com
        user_login:
          type: string
          example: contoh-user
        password_login:
          type: string
          description: Minimal 8 karakter, kombinasi huruf dan angka.
          example: contoh1234
        lokasi_server:
          type: string
          example: Server-A
        lokasi_database:
          type: string
          example: DB-A
        layanan:
          type: string
          example: Keuangan
        koneksi:
          type: string
          example: VPN
        skala:
          type: string
          enum: [Kecil, Sedang, Besar]
          default: Kecil
        is_active:
          type: boolean
          default: true

    AplikasiUpdate:
      type: object
      description: Semua field opsional, hanya kirim yang ingin diubah.
      properties:
        nama_aplikasi:
          type: string
        url_link:
          type: string
        user_login:
          type: string
        password_login:
          type: string
          description: Kosongkan atau kirim "•••••" agar password tidak berubah. Kalau diisi, minimal 8 karakter kombinasi huruf dan angka.
        lokasi_server:
          type: string
        lokasi_database:
          type: string
        layanan:
          type: string
        koneksi:
          type: string
        skala:
          type: string
          enum: [Kecil, Sedang, Besar]
        is_active:
          type: boolean

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Buat akun admin pertama (setup awal)
      description: Hanya bisa dipakai saat belum ada user sama sekali. Setelah admin terdaftar, endpoint ini menolak semua permintaan.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name:
                  type: string
                  example: Contoh Nama
                username:
                  type: string
                  minLength: 3
                  example: contohuser
                email:
                  type: string
                  format: email
                  example: contoh@example.com
                password:
                  type: string
                  description: Minimal 8 karakter, kombinasi huruf dan angka.
                  example: contoh1234
      responses:
        "201":
          description: Akun admin berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Contoh Nama
                      username:
                        type: string
                        example: contohuser
                      email:
                        type: string
                        example: contoh@example.com
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registrasi ditutup karena admin sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Registrasi ditutup, admin sudah terdaftar

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: contohuser
                password:
                  type: string
                  example: contoh1234
      responses:
        "200":
          description: Login berhasil, token JWT berlaku 8 jam
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: xxx
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Contoh Nama
                      username:
                        type: string
                        example: contohuser
        "400":
          description: Username atau password kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Username wajib diisi
        "401":
          description: Username atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: username atau password salah

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Tautan reset password lewat email
      description: Respons selalu sama, baik email terdaftar maupun tidak, supaya email yang terdaftar tidak bisa ditebak. Jika terdaftar, tautan reset (berlaku 15 menit) dikirim ke email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: contoh@example.com
      responses:
        "200":
          description: Permintaan diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jika email terdaftar, link reset password sudah dikirim
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Atur password baru dengan token dari email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  example: token-dari-email
                password:
                  type: string
                  description: Minimal 8 karakter, kombinasi huruf dan angka.
                  example: baru12345
      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password berhasil diubah, silakan login
        "400":
          description: Password tidak valid, atau token tidak valid/sudah kadaluarsa (15 menit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Token tidak valid atau sudah kadaluarsa

  /api/aplikasi:
    get:
      tags: [Aplikasi]
      summary: get semua data aplikasi
      description: Hanya data yang belum dihapus, urut dari yang terbaru. Mendukung pencarian, filter, dan halaman lewat query.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Cari di nama aplikasi dan URL (tidak peka huruf besar/kecil). Kolom lokasi tidak bisa dicari karena terenkripsi.
          schema:
            type: string
          example: sap
        - name: layanan
          in: query
          description: Filter layanan (tidak peka huruf besar/kecil)
          schema:
            type: string
          example: web
        - name: koneksi
          in: query
          description: Filter koneksi (tidak peka huruf besar/kecil)
          schema:
            type: string
          example: vpn
        - name: skala
          in: query
          description: Filter skala (tidak peka huruf besar/kecil)
          schema:
            type: string
          example: Kecil
        - name: page
          in: query
          description: Nomor halaman, mulai dari 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah data per halaman (maksimal 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Daftar aplikasi beserta informasi halaman
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AplikasiList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Aplikasi]
      summary: Tambah aplikasi
      description: Data sensitif disimpan terenkripsi, dan aksi ini dicatat di audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AplikasiCreate"
      responses:
        "201":
          description: Aplikasi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aplikasi"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/aplikasi/namaaplikasi/{nama}:
    get:
      tags: [Aplikasi]
      summary: search aplikasi berdasarkan nama
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamaParam"
      responses:
        "200":
          description: Aplikasi yang cocok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aplikasi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/aplikasi/{id}:
    get:
      tags: [Aplikasi]
      summary: get data aplikasi berdasarkan id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Data aplikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aplikasi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Aplikasi]
      summary: patch aplikasi
      description: Hanya kolom yang dikirim yang diubah. Perubahan dicatat di audit log (nama kolomnya saja).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AplikasiUpdate"
      responses:
        "200":
          description: Aplikasi diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aplikasi"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Aplikasi]
      summary: Hapus aplikasi (soft delete)
      description: Data tidak dihapus permanen, hanya ditandai terhapus. Aksi dicatat di audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"